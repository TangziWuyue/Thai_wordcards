<!doctype html>
<html lang="zh-CN" data-font="sarabun" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>泰语组合练习</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1b1b'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff'%3E%E0%B8%81%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="fonts-cjk.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>泰语组合练习</h1>
      <p class="sub">随机组合辅音与元音，自己挑声调，跟着念出声。</p>
    </header>

    <div class="layout">
      <div class="col-main">
        <section class="card">
          <p class="syllable" id="syllable" aria-live="polite">—</p>
          <p class="roman" id="roman">点「随机组合」开始</p>
          <p class="parts" id="parts"></p>
        </section>

        <section class="block">
          <div class="label-row">
            <span class="label">声调</span>
          </div>
          <div class="tones" id="tones" role="group" aria-label="选择声调"></div>
          <p class="hint tone-hint" id="toneHint"></p>
        </section>

        <section class="actions">
          <button type="button" class="btn primary" id="randomBtn">随机组合<kbd>空格</kbd></button>
          <button type="button" class="btn" id="speakBtn">播放发音<kbd>⏎</kbd></button>
        </section>
      </div>

      <div class="col-side">
        <details class="panel" open>
          <summary>词表</summary>
          <div class="panel-body">
            <div class="label-row">
              <span class="label">辅音</span>
              <span class="row-end">
                <span class="hint">44 个</span>
                <button type="button" class="mini" id="consAll">全选</button>
                <button type="button" class="mini" id="consNone">全不选</button>
              </span>
            </div>
            <div id="consonants"></div>
            <div class="label-row">
              <span class="label">元音</span>
              <span class="row-end">
                <span class="hint" id="vowelHint"></span>
                <button type="button" class="mini" id="vowelAll">全选</button>
                <button type="button" class="mini" id="vowelNone">全不选</button>
              </span>
            </div>
            <!-- 容器本身不能带 chips：分组标题和每组字块要各占一行 -->
            <div class="vowel-list" id="vowels"></div>
          </div>
        </details>

        <details class="panel">
          <summary>选项</summary>
          <div class="panel-body">
            <div class="label-row">
              <span class="label">字体</span>
            </div>
            <div class="seg" id="fontSeg" role="group" aria-label="泰文字体"></div>

            <div class="label-row">
              <span class="label">音标</span>
            </div>
            <div class="seg" id="romanSeg" role="group" aria-label="音标写法"></div>

            <div class="label-row">
              <span class="label">外观</span>
            </div>
            <div class="seg" id="themeSeg" role="group" aria-label="外观"></div>

            <label class="switch">
              <input type="checkbox" id="optClusters">
              <span>允许辅音簇（กร กล คร …）</span>
            </label>
            <label class="switch">
              <input type="checkbox" id="optFinal" checked>
              <span>允许尾辅音（约一半概率）</span>
            </label>
            <label class="switch">
              <input type="checkbox" id="optVowelOnset">
              <span>允许元音充当声母（ฤ ฤๅ ฦ ฦๅ）</span>
            </label>
            <label class="switch">
              <input type="checkbox" id="optStrict" checked>
              <span>遵守声调规则：禁用该组合用不上的声调</span>
            </label>
            <label class="switch">
              <input type="checkbox" id="optAutoSpeak">
              <span>随机后自动朗读</span>
            </label>
          </div>
        </details>
      </div>

      <footer class="foot">
        <span id="voiceInfo">语音：检测中…</span>
        <span class="note">组合多为无意义音节，只练拼读</span>
      </footer>
    </div>
  </main>

  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
